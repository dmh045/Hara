version: "3.0"
status: REFERENCE_ONLY
source: "IAV AVP HARA workbook appendices: front, rear and side interactions; formula review 2026-11-02"
# Kept at this source path for manifest/checkpoint provenance. The former
# contact-time-plus-stop-time formulas were not executed by the current runtime.
# Their executable-looking FINALIZED/default/fallback declarations are removed.
# Historical content is preserved by Git and existing frozen method snapshots.
formulas: []
authoritative_timing_policy: normalized/project_analysis_policy.yaml#timing_analysis
reference_kinematics:
  longitudinal:
    relation: "Each motion phase uses s=v0*dt+a*dt^2/2 and v=v0+a*dt; clamp braking at the first stop and continue a declared hold. First contact is solved over all phases, not inferred from final separation alone."
    interpretation: "Appendix t1/t2 are supplied phase durations. Their sum alone does not establish the latest permissible response onset. Velocities at a selected evaluation time are not impact velocities unless contact occurs then."
  lateral:
    relation: "Fixed velocity headings use vx=v*cos(theta), vy=v*sin(theta), with theta measured from body +x toward +y. First simultaneous overlap is solved in both axes."
    interpretation: "The appendix heading projection is distinct from constant-curvature motion and wheel steering angles. Contact-normal closing speed and full relative-speed norm remain separate. The active S method retains its declared speed semantics."
  contact_time:
    interpretation: "A first-contact time is trajectory evidence, not by itself a proven avoidance response deadline. Never add time after contact to create an FTTI allowance."
