    - 环境条件
    - 功能要求
ego_speed_point_selection:
  rule_id: AVP_EGO_SPEED_CLOSED_UPPER_BOUND_V1
  choice: UPPER_CLOSED_BOUND_OF_EFFECTIVE_OPERATION_RANGE
  applies_to: current_ego_analysis_speed
  status: CONFIRMED_FOR_CURRENT_PROJECT
  require_finite_closed_upper_bound: true
  require_source_and_scope: true
  value_semantic: PRE_FAULT_OPERATING_SPEED
  stationary_initial_speed_kph: 0
  impact_speed_requires_separate_source: true
severity_evaluation:
  rule_id: P7_SAME_MECHANISM_FINITE_MAX_AND_INVARIANCE
  status: CONFIRMED_FOR_CURRENT_PROJECT
  source: HARA_P7_综合改进_整合开发提示词_20261014.md#S-1-S-4
  aggregation: MAXIMUM_PHYSICALLY_POSSIBLE_BRANCH
  invariance: ALL_FEASIBLE_BRANCHES_AND_TABLE_INTERVALS
  require_same_mechanism_and_impact_time: true
representative_motion_rules:
  - rule_id: P7R_BRAKING_TEMPLATE_CONSTANT_SPEED_CASE
    status: CONFIRMED_FOR_CURRENT_PROJECT
    source: HARA_P7R_详细修复提示词_20261016.md#5.2路径B
    template_ids: [FM_TEMPLATE_001, FM_TEMPLATE_002]
    failure_types: [loss, degraded]
    operating_modes: [parking_vehicle_control]
    model: CONSTANT_SPEED_REPRESENTATIVE
    object_speed_kph: 0
    require_positive_initial_speed: true
    require_explicit_longitudinal_approach: true
    condition: >-
      Selected brake-insufficiency/loss template, continuing at the sourced
      representative initial speed to its stationary obstacle. This is a
      constant-speed analytical case, not a measured impact or a fault maximum.
      Residual braking, drive acceleration and gravity-induced speed changes
      are separate trajectories and are not proved covered by this case.
template_semantic_aliases:
  # Same brake-loss meaning as the source template; no binding to a dated MF ID.
  # Equivalent complete-loss wording observed in a fresh production return.
  # Still requires the existing canonical loss selector and parking exclusions.
  FM_TEMPLATE_002: [制动扭矩输出功能完全丧失, 制动扭矩输出完全缺失]
template_context_exclusions:
  # Parking-hold failures need their own rollaway/drag mechanism; a service
  # braking template cannot be authorized by the word "degraded" alone.
  FM_TEMPLATE_001: [驻车, 夹紧, EPB]
  FM_TEMPLATE_002: [驻车, 夹紧, EPB]
  FM_TEMPLATE_004: [驻车, 夹紧, 制动, 转向, 报警]
driver_location_convention:
  rule_id: P7_C4_OUTSIDE_SEAT_AS_OUTSIDE_VEHICLE
  status: CONFIRMED_FOR_CURRENT_PROJECT
  project_scope: current_avp_item_definition
  operating_modes: [parking_vehicle_control]
  source: HARA_P7_综合改进_整合开发提示词_20261014.md#C-4
  outside_driver_seat_is_outside_vehicle: true
  display_label: 不在驾驶位
