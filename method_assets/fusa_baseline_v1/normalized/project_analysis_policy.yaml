policy_id: AVP_SEC_2026_10_P7R
version: "2.1"
supersedes: AVP_SEC_2026_10_P7
project_scope: current_avp_item_definition
source_kind: USER_RELAYED_HARA_ENGINEERING_OPINION
source_note: >-
  A1-A5 were relayed by the user from HARA engineering discussion. This record
  does not represent a signed engineering release or a quotation from ISO/VDA.
input_selection:
  policy_id: EXCLUDE_NONFUNCTIONAL_PERFORMANCE_SPEED_V1
  excluded_sections_for_scoring:
    - 性能要求
  non_operational_speed_sections:
    - 执行器能力参数要求
  retained_sections_for_scoring:
    - 环境条件
    - 功能要求
ego_speed_point_selection:
  rule_id: AVP_EGO_SPEED_CLOSED_UPPER_BOUND_V1
  choice: UPPER_CLOSED_BOUND_OF_EFFECTIVE_OPERATION_RANGE
  applies_to: current_ego_analysis_speed
  status: CONFIRMED_FOR_CURRENT_PROJECT
  require_finite_closed_upper_bound: true
  require_source_and_scope: true
  value_semantic: PRE_FAULT_OPERATING_SPEED
  stationary_initial_speed_kph: 0
  impact_speed_requires_separate_source: true
severity_evaluation:
  rule_id: P7_SAME_MECHANISM_FINITE_MAX_AND_INVARIANCE
  status: CONFIRMED_FOR_CURRENT_PROJECT
  source: HARA_P7_综合改进_整合开发提示词_20261014.md#S-1-S-4
  aggregation: MAXIMUM_PHYSICALLY_POSSIBLE_BRANCH
  invariance: ALL_FEASIBLE_BRANCHES_AND_TABLE_INTERVALS
  require_same_mechanism_and_impact_time: true
representative_motion_rules:
  - rule_id: P7R_BRAKING_TEMPLATE_CONSTANT_SPEED_CASE
    status: CONFIRMED_FOR_CURRENT_PROJECT
    source: HARA_P7R_详细修复提示词_20261016.md#5.2路径B
    template_ids: [FM_TEMPLATE_001, FM_TEMPLATE_002]
    failure_types: [loss, degraded]
    operating_modes: [parking_vehicle_control]
    model: CONSTANT_SPEED_REPRESENTATIVE
    object_speed_kph: 0
    require_positive_initial_speed: true
    require_explicit_longitudinal_approach: true
    condition: >-
      Selected brake-insufficiency/loss template, continuing at the sourced
      representative initial speed to its stationary obstacle. This is a
      constant-speed analytical case, not a measured impact or a fault maximum.
      Residual braking, drive acceleration and gravity-induced speed changes
      are separate trajectories and are not proved covered by this case.
template_semantic_aliases:
  # Same brake-loss meaning as the source template; no binding to a dated MF ID.
  # Equivalent complete-loss wording observed in a fresh production return.
  # Still requires the existing canonical loss selector and parking exclusions.
  FM_TEMPLATE_002: [制动扭矩输出功能完全丧失, 制动扭矩输出完全缺失]
template_context_exclusions:
  # Parking-hold failures need their own rollaway/drag mechanism; a service
  # braking template cannot be authorized by the word "degraded" alone.
  FM_TEMPLATE_001: [驻车, 夹紧, EPB]
  FM_TEMPLATE_002: [驻车, 夹紧, EPB]
  FM_TEMPLATE_004: [驻车, 夹紧, 制动, 转向, 报警]
driver_location_convention:
  rule_id: P7_C4_OUTSIDE_SEAT_AS_OUTSIDE_VEHICLE
  status: CONFIRMED_FOR_CURRENT_PROJECT
  project_scope: current_avp_item_definition
  operating_modes: [parking_vehicle_control]
  source: HARA_P7_综合改进_整合开发提示词_20261014.md#C-4
  outside_driver_seat_is_outside_vehicle: true
  display_label: 不在驾驶位
atom_semantic_refinements:
  Audi_state_standing:
    source: raw/vda702_atoms.yaml#Audi_state_standing
    source_label: Vehicle stands
    ego_dynamics:
      motion_state: STATIONARY
      v_range_kph: [0, 0]
      unit: kph
controllability:
  unknown_override_policy: SKIP_TO_TTC
  basis: POSITIVE_OVERRIDE_ONLY_THEN_TTC_FALLBACK
  status: CONFIRMED_FOR_CURRENT_PROJECT
  conditional_reference_rules:
    - rule_id: MQB_LOW_SPEED_ERRONEOUS_STEERING_REFERENCE
      status: CONDITIONAL_REFERENCE
      result: C1
      source_document: MQBEvo-RHP2.0-SOTIF-GuR.xlsx
      source_location: Prerequisite & Assumptions park!D17
      source_sha256: ffb29c4c4a662ea3ba936ad817af6a37f1d0812e54a0538d2adafba5bb73a763
      source_statement: "Unwarranted or erroneous steering interventions v < 15 kph are easily controllable (C1); cited REF_19 FuSi validation study."
      limitation: "REF_19 full study is unavailable; transfer to the current project remains a conditional reference evaluation, not engineering approval."
      function_output_terms: [行车转角, 转向, steering]
      when:
        component_category: [computing]
        failure_type: [excessive, wrong_value, unintended_activation]
        operating_mode: [parking_vehicle_control]
        fault_motion_model: [CONSTANT_LATERAL_ACCELERATION_TO_CONTACT]
        driver_in_vehicle: true
        emergency_braking_available: true
      trajectory_speed_upper_exclusive_kph: 15
      rationale: "驾驶员在车内且剩余制动可用；低速非预期或错误转向干预，按参考工况评为 C1。跨项目适用性待审核；未使用纵向 TTC 分档。"
    - rule_id: IAV_LOW_SPEED_STEERING_DEVIATION_BRAKING_REFERENCE
      status: CONDITIONAL_REFERENCE
      result: C1
      source_document: 副本IAV_EHYREEV蓝海项目_代客泊车-HARA分析_V1.0.xlsx
      source_location: "6-HARA Analyses!M36:N40; MQBEvo-RHP2.0-SOTIF-GuR.xlsx:Prerequisite & Assumptions park!D17"
      source_sha256: 0698cc8e2f87ae861480c67ce8df89910f59d635a0cb49587e85b723e1d48898
      source_statement: "IAV steering loss/insufficient steering cases credit available emergency braking or an explicitly described other-vehicle evasion path as C1. MQB limits its erroneous-steering C1 assumption to v < 15 kph."
      limitation: "Selected project transfer on 2026-10-26: apply the low-speed scope to a source-scoped failed steering control, including an upstream fault whose validated physical plan identifies that consequence, only when an in-seat driver retains braking. Assumes monitoring and timely manual interruption; does not cover brake loss, independent vehicle instability, or higher trajectory speeds. This is a project reference judgement, not a validated avoidance probability."
      when:
        component_category: [computing]
        operating_mode: [parking_vehicle_control]
        fault_motion_model: [CONSTANT_LATERAL_ACCELERATION_TO_CONTACT]
        driver_in_vehicle: true
        emergency_braking_available: true
        steering_control_available: false
      trajectory_speed_upper_exclusive_kph: 15
      rationale: "驾驶员在驾驶位，转向指令异常后仍可人工制动；在持续监控并及时中止的低速代表工况下，参考转向丢失/不足的可制动案例评为 C1。该规则不覆盖制动同时失效、车辆失稳或轨迹速度达到 15 km/h；未套用纵向 TTC。"
    - rule_id: IAV_UNATTENDED_PARKING_REFERENCE
      status: CONDITIONAL_REFERENCE
      result: C3
      evaluation_phase: AFTER_APPLICABLE_METHODS
      requires_contact: true
      source_document: 副本IAV_EHYREEV蓝海项目_代客泊车-HARA分析_V1.0.xlsx
      source_location: "6-HARA Analyses!M2:N6,M24:N27,M34:N34,M38:N38,M41:N41,M51:N51"
      source_sha256: 0698cc8e2f87ae861480c67ce8df89910f59d635a0cb49587e85b723e1d48898
      source_statement: "The unattended parking braking, drive, erroneous steering and rollaway collision cases select C3 because the driver is outside the vehicle. Cases with specific remote braking or counterpart evasion instead use C1."
      limitation: "Selected project reference judgement on 2026-10-26: outside-driver collision without an applicable evidenced avoidance override is evaluated without credit for an unestablished remote or counterpart intervention. Missing intervention facts stay missing; this does not prove that a remote interface is absent or a person cannot evade. Contact and driver-position inputs must be valid."
      when:
        operating_mode: [parking_vehicle_control]
        fault_motion_model: [CONSTANT_SPEED_REPRESENTATIVE, CONSTANT_ACCELERATION_TO_IMPACT_DISTANCE, GRADE_ROLLAWAY_TO_IMPACT_DISTANCE, CONSTANT_LATERAL_ACCELERATION_TO_CONTACT, RECTILINEAR_MOVING_TARGET_CONTACT]
        driver_in_vehicle: false
      rationale: "驾驶员不在驾驶位，不能直接操作车内控制；当前碰撞分支没有成立的远程干预或他方避让规则。按无人直接接管的泊车参考工况评为 C3，不计入尚未成立的额外规避收益；已有有效干预规则优先。"
    - rule_id: IAV_UNAVAILABLE_BRAKING_REFERENCE
      status: CONDITIONAL_REFERENCE
      result: C3
      evaluation_phase: AFTER_APPLICABLE_METHODS
      requires_contact: true
      source_document: 副本IAV_EHYREEV蓝海项目_代客泊车-HARA分析_V1.0.xlsx
      source_location: "6-HARA Analyses!D2:N6,D10:N15"
      source_sha256: 0698cc8e2f87ae861480c67ce8df89910f59d635a0cb49587e85b723e1d48898
      source_statement: "Reference brake-loss/insufficient-braking collision cases use C3 when the required intervention cannot be performed."
      limitation: "Selected project transfer on 2026-10-26: for a proven contact trajectory with explicitly unavailable braking, no lower C credit is taken without a separately established avoidance path. In-seat use is a conditional extension of the reference, not its original outside-driver fact. Unknown braking availability does not match."
      when:
        operating_mode: [parking_vehicle_control]
        fault_motion_model: [CONSTANT_SPEED_REPRESENTATIVE, CONSTANT_ACCELERATION_TO_IMPACT_DISTANCE, GRADE_ROLLAWAY_TO_IMPACT_DISTANCE, CONSTANT_LATERAL_ACCELERATION_TO_CONTACT, RECTILINEAR_MOVING_TARGET_CONTACT]
        driver_in_vehicle: true
        emergency_braking_available: false
      rationale: "当前故障条件明确不能使用制动避险，且轨迹计算存在接触；没有成立的独立避让规则时，按失去有效干预的代表工况评为 C3。保留其他剩余能力，不将它们自动等同于本场景已能避险；本项为参考方法的条件性扩展。"
decisions:
  A1:
    status: CONFIRMED_FOR_CURRENT_PROJECT
    scope: Ordinary static objects need no separate object E atom; physical objects and harm analysis remain.
  A2:
    status: CONFIRMED_FOR_CURRENT_PROJECT
    scope: Retain state malfunction identity and analyze its evidenced vehicle control consequence.
  A3:
    status: CONFIRMED_FOR_CURRENT_PROJECT
    scope: Select the closed upper bound of the current applicable ego operating speed range.
  A4:
    status: PARTIALLY_SPECIFIED
    scope: Use explicit scoped facts and deterministic scenario derivation; numeric and C defaults remain candidates until confirmed.
  A5:
    status: CONFIRMED_FOR_CURRENT_PROJECT
    scope: Analyze each allowed driver-seat configuration. For the current AVP parking control project only, outside driver seat is analyzed as outside vehicle under P7 C-4; preserve original source wording.
