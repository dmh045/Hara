  A5:
    status: CONFIRMED_FOR_CURRENT_PROJECT
    scope: Analyze each allowed driver-seat configuration. For the current AVP parking control project only, outside driver seat is analyzed as outside vehicle under P7 C-4; preserve original source wording.
