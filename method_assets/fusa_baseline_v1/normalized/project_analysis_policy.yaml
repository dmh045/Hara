    scope: Retain state malfunction identity and analyze its evidenced vehicle control consequence.
  A3:
    status: CONFIRMED_FOR_CURRENT_PROJECT
    scope: Select the closed upper bound of the current applicable ego operating speed range.
  A4:
    status: PARTIALLY_SPECIFIED
